<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asuna · 开源项目精选</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e6e9ef;
    --fg: #1c2128;
    --muted: #77808c;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --green: #16a34a;
    --danger: #dc2626;
    --gold: #eab308;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
    --shadow-md: 0 8px 24px rgba(16,24,40,.10);
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1100px 420px at 85% -10%, rgba(37,99,235,.08), transparent 60%),
      radial-gradient(800px 320px at 5% -5%, rgba(124,58,237,.06), transparent 55%),
      var(--bg);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: none; }
  ::selection { background: #bfdbfe; }

  /* ================= Header ================= */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 28px;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 11px; margin-right: 20px; }
  .brand .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #7c3aed 60%, #db2777);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 17px; box-shadow: 0 2px 10px rgba(37,99,235,.35);
    transition: transform .3s;
  }
  .brand:hover .logo { transform: rotate(-8deg) scale(1.06); }
  .brand b { font-size: 16px; }
  .brand small { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; }
  .brand a { color: inherit; }

  .tab {
    padding: 7px 16px; border-radius: 999px; cursor: pointer; border: none;
    background: transparent; font-size: 14px; color: var(--muted);
    transition: all .15s;
  }
  .tab:hover { color: var(--fg); background: rgba(0,0,0,.05); }
  .tab.active { background: var(--fg); color: #fff; box-shadow: var(--shadow-sm); }

  .spacer { flex: 1; }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 210px; padding: 8px 14px 8px 32px;
    border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; background: var(--bg); outline: none;
    transition: all .2s;
  }
  .search-wrap input:focus {
    width: 280px; border-color: var(--accent); background: #fff;
    box-shadow: 0 0 0 3px rgba(37,99,235,.13);
  }
  .search-wrap::before {
    content: "🔍"; position: absolute; left: 11px; top: 50%;
    transform: translateY(-50%); font-size: 12px; opacity: .55; pointer-events: none;
  }
  .search-wrap kbd {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
    font-size: 10px; color: var(--muted); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; background: #fff; pointer-events: none;
  }

  .btn {
    padding: 8px 16px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card); color: var(--fg); cursor: pointer; font-size: 14px;
    transition: all .15s; white-space: nowrap;
  }
  .btn:hover { border-color: #cdd3dc; box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .btn:active { transform: translateY(0) scale(.98); }
  .btn.primary { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }
  .btn.primary:hover { filter: brightness(1.06); box-shadow: 0 3px 12px rgba(22,163,74,.35); }
  .btn.accent { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
  .btn.accent:hover { filter: brightness(1.08); box-shadow: 0 3px 12px rgba(37,99,235,.35); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  .btn.ghost:hover { color: var(--fg); background: rgba(0,0,0,.05); box-shadow: none; transform: none; }
  .btn.sm { padding: 5px 12px; font-size: 13px; border-radius: 8px; }
  .btn[disabled] { opacity: .55; cursor: wait; transform: none; }

  .user-chip {
    display: flex; align-items: center; gap: 8px; font-size: 13px;
    background: var(--accent-soft); color: var(--accent);
    padding: 5px 12px 5px 6px; border-radius: 999px;
  }
  .user-chip img { border-radius: 50%; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
  #logoutLink { opacity: .65; cursor: pointer; }
  #logoutLink:hover { opacity: 1; }

  /* ================= Layout ================= */
  main { max-width: 1280px; margin: 24px auto 60px; padding: 0 24px; }
  #browseView { display: flex; gap: 20px; align-items: flex-start; }

  /* ---------- Tree ---------- */
  aside#tree {
    width: 296px; flex-shrink: 0; background: var(--card);
    border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow-sm); overflow: hidden;
    position: sticky; top: 78px;
    max-height: calc(100vh - 100px); display: flex; flex-direction: column;
  }
  .tree-head {
    padding: 14px 16px 11px; font-size: 12px; font-weight: 700;
    color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .tree-head .total { font-weight: 500; text-transform: none; letter-spacing: 0; }
  .tree-scroll { overflow-y: auto; padding: 8px; flex: 1; }
  .tree-scroll::-webkit-scrollbar { width: 6px; }
  .tree-scroll::-webkit-scrollbar-thumb { background: #d5dae2; border-radius: 3px; }

  .tree-row {
    display: flex; align-items: center; gap: 6px;
    padding: 7px 10px; cursor: pointer; font-size: 13.5px;
    border-radius: 9px; transition: background .12s;
    margin: 1px 0; user-select: none;
  }
  .tree-row:hover { background: var(--bg); }
  .tree-row.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .tree-row.drop-target { background: #dcfce7; outline: 2px dashed var(--green); outline-offset: -2px; }
  .chev {
    width: 16px; text-align: center; color: var(--muted);
    font-size: 10px; transition: transform .18s; flex-shrink: 0; cursor: pointer;
  }
  .chev.open { transform: rotate(90deg); }
  .chev.hidden-vis { visibility: hidden; }
  .ficon { flex-shrink: 0; font-size: 14px; }
  .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count {
    font-size: 11px; color: var(--muted); background: var(--bg);
    border-radius: 999px; padding: 2px 8px; font-weight: 600; min-width: 26px; text-align: center;
    transition: all .15s;
  }
  .tree-row:hover .count { background: #e9edf3; }
  .tree-row.active .count { background: #dbe7ff; color: var(--accent); }
  .tree-row .ops { visibility: hidden; display: flex; gap: 8px; }
  .tree-row:hover .ops { visibility: visible; }
  .ops a { color: var(--accent); cursor: pointer; font-size: 12px; font-weight: 500; }
  .ops a.del { color: var(--danger); }
  .tree-children { animation: slideDown .2s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---------- Panel ---------- */
  section#panel {
    flex: 1; min-width: 0; background: transparent; min-height: 500px;
  }
  .panel-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 22px 26px;
    animation: fadeUp .28s ease both;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .panel-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .crumbs { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .crumbs .seg { cursor: pointer; transition: color .12s; }
  .crumbs .seg:hover { color: var(--accent); }
  .crumbs .seg:last-child { cursor: default; }
  .crumbs .sep { color: #c3cad4; font-weight: 400; }
  .panel-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .panel-tools select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: #fff; color: var(--muted); cursor: pointer; outline: none;
  }
  .panel-sub { color: var(--muted); font-size: 13px; margin: 4px 0 20px; }
  .panel-sub b { color: var(--fg); }

  /* ---------- Cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .pcard {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 16px; cursor: pointer; overflow: hidden;
    transition: transform .16s, box-shadow .16s, border-color .16s;
    animation: fadeUp .3s ease both;
  }
  .pcard:hover {
    transform: translateY(-3px); box-shadow: var(--shadow-md);
    border-color: #c7d7fe;
  }
  .pcard:hover .card-go { opacity: 1; transform: translateX(0); }
  .pcard-top { display: flex; align-items: center; gap: 10px; }
  .pcard-top img {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: #fff; flex-shrink: 0;
  }
  .pcard-top b { font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard-top b a { color: var(--fg); }
  .pcard-top b a:hover { color: var(--accent); }
  .card-go {
    opacity: 0; transform: translateX(-4px); transition: all .16s;
    color: var(--accent); font-size: 15px; flex-shrink: 0;
  }
  .card-desc {
    color: var(--muted); font-size: 13px; line-height: 1.55; flex: 1;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    min-height: 40px;
  }
  .card-meta { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--muted); }
  .card-meta .lang { display: flex; align-items: center; gap: 5px; }
  .lang-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .card-meta .star { color: var(--gold); font-weight: 600; }
  .card-actions {
    position: absolute; top: 10px; right: 10px; display: flex; gap: 6px;
    opacity: 0; transition: opacity .15s;
  }
  .pcard:hover .card-actions { opacity: 1; }
  .icon-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--border);
    background: #fff; cursor: pointer; font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: all .12s; color: var(--muted);
  }
  .icon-btn:hover { background: var(--bg); transform: scale(1.08); }
  .icon-btn.del:hover { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
  .pcard[draggable=true] { cursor: grab; }
  .pcard[draggable=true]:active { cursor: grabbing; }

  .hit-path { font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; align-self: flex-start; }

  .empty { text-align: center; padding: 80px 20px; color: var(--muted); animation: fadeUp .3s ease both; }
  .empty .big { font-size: 46px; margin-bottom: 14px; animation: bob 3s ease-in-out infinite; display: inline-block; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .empty p { margin: 0 0 18px; font-size: 15px; }

  /* ---------- Skeleton ---------- */
  .skel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .skel {
    height: 128px; border-radius: 12px; border: 1px solid var(--border);
    background: linear-gradient(100deg, #eef1f5 40%, #f8fafc 50%, #eef1f5 60%);
    background-size: 200% 100%; animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- Editor bar / Modal ---------- */
  .overlay {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5);
    z-index: 90; align-items: flex-start; justify-content: center;
    backdrop-filter: blur(3px); overflow-y: auto; padding: 8vh 16px 40px;
    animation: fadeIn .15s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } }
  .overlay .box {
    background: #fff; padding: 28px 30px; border-radius: 18px;
    box-shadow: var(--shadow-md); width: 560px; max-width: 100%;
    animation: popIn .22s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.94) translateY(12px); } }
  .overlay h3 { margin: 0 0 18px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .overlay .steps { margin: 0 0 16px; padding-left: 20px; color: var(--muted); font-size: 13.5px; line-height: 2.1; }
  .overlay input[type=password], .overlay input[type=text] {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 14px; margin-bottom: 14px; outline: none; transition: all .15s;
  }
  .overlay input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.13); }
  .overlay .form-row { display: flex; gap: 8px; }
  .overlay select {
    flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 14px; background: #fff; outline: none;
  }
  .meta-preview {
    display: flex; gap: 12px; align-items: flex-start;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin: 14px 0; animation: fadeUp .2s ease;
  }
  .meta-preview img { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border); }
  .meta-preview .mp-name { font-weight: 700; font-size: 14.5px; }
  .meta-preview .mp-desc { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.55; }
  .meta-preview .mp-meta { margin-top: 6px; font-size: 12.5px; color: var(--muted); display: flex; gap: 14px; align-items: center; }
  .spin {
    display: inline-block; width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #codeVal {
    font-size: 34px; letter-spacing: 6px; font-weight: 700; color: var(--accent);
    margin: 14px 0; user-select: all; text-align: center;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed; bottom: -70px; left: 50%; transform: translateX(-50%);
    background: #1c2128; color: #fff; padding: 12px 24px; border-radius: 999px;
    transition: bottom .3s cubic-bezier(.2,.9,.3,1.2); z-index: 99;
    max-width: 82vw; font-size: 14px; box-shadow: var(--shadow-md);
  }
  #toast.show { bottom: 34px; }
  #toast.err { background: var(--danger); }

  /* ---------- Preview ---------- */
  #previewView {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 28px 36px;
    animation: fadeUp .28s ease both;
  }
  #previewView pre {
    white-space: pre-wrap; word-break: break-all; font-size: 13px;
    background: var(--bg); padding: 16px; border-radius: 10px; line-height: 1.6;
  }
  .md-body { font-size: 15px; line-height: 1.7; }
  .md-body h1, .md-body h2 { border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .md-body table { border-collapse: collapse; }
  .md-body th, .md-body td { border: 1px solid var(--border); padding: 6px 12px; }

  footer { text-align: center; color: var(--muted); font-size: 12.5px; padding: 0 0 40px; }

  @media (max-width: 860px) {
    #browseView { flex-direction: column; }
    aside#tree { width: 100%; position: static; max-height: 340px; }
    header { padding: 10px 14px; flex-wrap: wrap; }
    .search-wrap input { width: 150px; }
    .search-wrap input:focus { width: 190px; }
    .search-wrap kbd { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo">⭐</div>
    <div>
      <b><a href="./" id="repoHome">Asuna</a></b>
      <small>开源项目精选 · 提交即收录</small>
    </div>
  </div>
  <button class="tab active" data-view="browse">浏览</button>
  <button class="tab" data-view="preview">README 预览</button>
  <div class="spacer"></div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="搜索项目…">
    <kbd>/</kbd>
  </div>
  <button id="saveBtn" class="btn primary" hidden>💾 保存更改</button>
  <span class="user-chip" id="userChip" hidden>
    <img id="userAvatar" width="24" height="24" alt="">
    <span id="userName"></span>·<a id="logoutLink">退出</a>
  </span>
  <button id="loginBtn" class="btn">🔑 登录编辑</button>
</header>

<main>
  <div id="browseView">
    <aside id="tree">
      <div class="tree-head">📂 分类目录 <span class="total" id="treeTotal"></span></div>
      <div class="tree-scroll" id="treeScroll"></div>
    </aside>
    <section id="panel"></section>
  </div>

  <div id="previewView" hidden></div>
</main>

<footer>
  Powered by <a href="https://github.com/weihubeats/Asuna" target="_blank" rel="noopener">Asuna</a>
  · 数据存储于 GitHub 仓库 · <a href="https://github.com/weihubeats/Asuna/issues/new/choose" target="_blank" rel="noopener">Issue 投稿</a>
</footer>

<!-- 添加项目弹窗 -->
<div class="overlay" id="addBox">
  <div class="box">
    <h3>➕ 添加项目</h3>
    <div class="form-row">
      <input type="text" id="inUrl" placeholder="粘贴 GitHub 仓库链接，回车自动获取">
      <button class="btn accent" id="fetchMetaBtn">获取</button>
    </div>
    <div id="addStep2" hidden>
      <div class="meta-preview" id="metaPreview"></div>
      <div class="form-row" style="margin-bottom:14px">
        <select id="selCategory"></select>
      </div>
      <div class="form-row">
        <button class="btn primary" id="addProjectBtn" style="flex:1">加入收录</button>
      </div>
    </div>
    <div style="margin-top:14px;text-align:right">
      <button class="btn ghost sm" id="addCancel">关闭</button>
    </div>
  </div>
</div>

<!-- PAT 登录弹窗 -->
<div class="overlay" id="tokenBox">
  <div class="box" style="width:500px">
    <h3>🔑 登录编辑</h3>
    <ol class="steps">
      <li>打开 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">创建 Fine-grained Token</a></li>
      <li>Repository access → <b>Only select repositories</b> → 勾选 <b>Asuna</b></li>
      <li>Permissions → Repository permissions → <b>Contents</b> 设为 <b>Read and write</b></li>
      <li>生成后复制 Token 粘贴到下方（仅存于你的浏览器）</li>
    </ol>
    <input type="password" id="tokenInput" placeholder="github_pat_… 或 ghp_…">
    <div style="display:flex;gap:8px">
      <button class="btn primary" id="tokenSave" style="flex:1">验证并登录</button>
      <button class="btn ghost" id="tokenCancel">取消</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="config.js?v=3"></script>
<script src="render.js?v=3"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="app.js?v=3"></script>
<script>
  (function () {
    var m = location.pathname.match(/^\/([^/]+)\/([^/]+)\/?/);
    if (window.ASUNA_CONFIG && !window.ASUNA_CONFIG.OWNER && m) {
      window.ASUNA_CONFIG.OWNER = m[1];
      window.ASUNA_CONFIG.REPO = m[2];
    }
    if (window.ASUNA_CONFIG) {
      document.getElementById("repoHome").href =
        "https://github.com/" + window.ASUNA_CONFIG.OWNER + "/" + window.ASUNA_CONFIG.REPO;
    }
  })();
</script>
</body>
</html>
