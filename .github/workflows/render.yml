name: Asuna Render & Stars

on:
  push:
    branches: [main]
    paths: ["data.json"]
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 01:00 刷新 star 快照
  workflow_dispatch:

# 与 asuna_sync 共用串行组，避免并发 push 互相覆盖
concurrency:
  group: asuna-push
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # 定时任务：刷新 data.json 内 star 数 + docs/stars.json 快照（页面零成本读取）
      - name: Update stars snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ASUNA_STARS=1 go run main.go

      # 每次数据变更：同步 Issue 表单分类下拉
      - name: Sync issue form
        run: ASUNA_RENDER=1 go run main.go

      - name: Commit
        run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "AsunaBot"
          git add -A
          git diff --cached --quiet || git commit -m "auto: sync issue form & stars snapshot"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "push 冲突，重试 $i/3"
            sleep $((i * 5))
          done
          exit 1
